name: Windows release candidate
on:
  workflow_dispatch:
  push:
    branches: ['release/v2.0.0-rc1']
permissions:
  contents: write
concurrency:
  group: walls-rc1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm WallsEC2.spec
      - name: Validate frozen application
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'wall-smoke.json'
          $exe = Resolve-Path 'dist/WallsEC2/WallsEC2.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', ('"' + $smoke + '"')) -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path $smoke)) { throw 'Frozen executable failed' }
          $r = Get-Content $smoke -Raw | ConvertFrom-Json
          if ($r.smoke_test -ne 'passed' -or $r.version -ne 'v2.0.0-rc1' -or !$r.icon -or $r.rows -ne 4) { throw 'Invalid smoke test result' }
          Copy-Item README.md,LICENSE -Destination dist/WallsEC2
          Copy-Item $smoke -Destination dist/WallsEC2/Smoke.json
          Compress-Archive -Path dist/WallsEC2 -DestinationPath WallsEC2-v2.0.0-rc1-Windows-x64.zip
          (Get-FileHash WallsEC2-v2.0.0-rc1-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  WallsEC2-v2.0.0-rc1-Windows-x64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WallsEC2-v2.0.0-rc1-Windows-x64
          path: |
            WallsEC2-v2.0.0-rc1-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tested prerelease
        if: github.ref == 'refs/heads/release/v2.0.0-rc1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0-rc1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; review explicitly before replacing it.' }
          gh release create v2.0.0-rc1 WallsEC2-v2.0.0-rc1-Windows-x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'WallsEC2 v2.0.0-rc1' --notes-file docs/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
